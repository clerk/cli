[install]
# Only install package versions published at least 2 days ago
minimumReleaseAge = 172800

[test]
# Clears env vars that would point tests at real client configs, and loads the
# version module first so its macro resolves the same way in every test worker.
preload = ["./packages/cli-core/src/test/preload.ts", "./packages/cli-core/src/test/version-preload.ts"]

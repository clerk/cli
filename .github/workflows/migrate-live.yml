name: Migrate live tests

# The live end-to-end tests of `clerk migrate` in test/migrate-live/, against
# real provider accounts and Clerk instances. Never part of PR CI.

on:
  schedule:
    - cron: "17 9 * * 1" # Mondays 09:17 UTC, off the top of the hour
  workflow_dispatch:
    inputs:
      provider:
        description: "One provider (auth0, authjs, better-auth, clerk, firebase, supabase, workos), or empty for all"
        type: string
        default: ""

concurrency:
  group: migrate-live
  cancel-in-progress: false # two runs on the same instances wipe each other

permissions:
  contents: read

env:
  CLERK_TELEMETRY_DISABLED: "1"

jobs:
  migrate-live:
    # The secrets live in this environment, which only allows main. A job from
    # any other branch is rejected before it starts, so a pushed branch can't
    # rewrite this workflow to read them.
    environment: migrate-live
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 240
    defaults:
      run:
        working-directory: test/migrate-live
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun install --frozen-lockfile
      # Secrets on this step only: the install steps above run third-party
      # install scripts and never see them. Both suites share the step so
      # there's one env block.
      - name: Migrate tests
        env:
          PROVIDER: ${{ inputs.provider }}
          CLERK_PLATFORM_API_KEY: ${{ secrets.MIGRATION_LIVE_TESTS_CLERK_PLATFORM_API_KEY }}
          CLERK_MIGRATE_TESTS_1_SECRET_KEY: ${{ secrets.MIGRATION_LIVE_TESTS_CLERK_MIGRATE_TESTS_1_SECRET_KEY }}
          CLERK_MIGRATE_TESTS_1_APP_ID: ${{ secrets.MIGRATION_LIVE_TESTS_CLERK_MIGRATE_TESTS_1_APP_ID }}
          CLERK_POOL_1_SECRET_KEY: ${{ secrets.MIGRATION_LIVE_TESTS_CLERK_POOL_1_SECRET_KEY }}
          CLERK_POOL_1_APP_ID: ${{ secrets.MIGRATION_LIVE_TESTS_CLERK_POOL_1_APP_ID }}
          CLERK_SOURCE_SECRET_KEY: ${{ secrets.MIGRATION_LIVE_TESTS_CLERK_SOURCE_SECRET_KEY }}
          CLERK_EVALS_SOURCE_APP_ID: ${{ secrets.MIGRATION_LIVE_TESTS_CLERK_EVALS_SOURCE_APP_ID }}
          CLERK_SECRET_KEY_10K_DEV: ${{ secrets.MIGRATION_LIVE_TESTS_CLERK_SECRET_KEY_10K_DEV }}
          CLERK_SECRET_KEY_10K_PROD: ${{ secrets.MIGRATION_LIVE_TESTS_CLERK_SECRET_KEY_10K_PROD }}
          BA_TURSO_DATABASE_URL: ${{ secrets.MIGRATION_LIVE_TESTS_BA_TURSO_DATABASE_URL }}
          BA_TURSO_DATABASE_TOKEN: ${{ secrets.MIGRATION_LIVE_TESTS_BA_TURSO_DATABASE_TOKEN }}
          AUTHJS_TURSO_DATABASE_URL: ${{ secrets.MIGRATION_LIVE_TESTS_AUTHJS_TURSO_DATABASE_URL }}
          AUTHJS_TURSO_DATABASE_TOKEN: ${{ secrets.MIGRATION_LIVE_TESTS_AUTHJS_TURSO_DATABASE_TOKEN }}
          AUTH0_DOMAIN: ${{ secrets.MIGRATION_LIVE_TESTS_AUTH0_DOMAIN }}
          AUTH0_CLIENT_ID: ${{ secrets.MIGRATION_LIVE_TESTS_AUTH0_CLIENT_ID }}
          AUTH0_CLIENT_SECRET: ${{ secrets.MIGRATION_LIVE_TESTS_AUTH0_CLIENT_SECRET }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.MIGRATION_LIVE_TESTS_NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.MIGRATION_LIVE_TESTS_SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_CONNECTION_STRING: ${{ secrets.MIGRATION_LIVE_TESTS_SUPABASE_CONNECTION_STRING }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.MIGRATION_LIVE_TESTS_SUPABASE_ACCESS_TOKEN }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.MIGRATION_LIVE_TESTS_FIREBASE_SERVICE_ACCOUNT_JSON }}
          FIREBASE_SERVICE_ACCOUNT_JSON_HASH_ROLE: ${{ secrets.MIGRATION_LIVE_TESTS_FIREBASE_SERVICE_ACCOUNT_JSON_HASH_ROLE }}
          WORKOS_API_KEY: ${{ secrets.MIGRATION_LIVE_TESTS_WORKOS_API_KEY }}
        # PROVIDER comes through env, never ${{ }} in the script: a dispatch
        # input pasted into a shell line is a script injection.
        run: |
          status=0
          case "$PROVIDER" in
            "")
              bash test-all.sh || status=1
              bun test-custom-source.ts --all --sources-dir data/custom-sources-answers || status=1
              ;;
            auth0|authjs|better-auth|clerk|firebase|supabase|workos)
              bun test-migrate.ts -p "$PROVIDER" || status=1
              ;;
            *)
              echo "Unknown provider: $PROVIDER"
              exit 2
              ;;
          esac
          exit "$status"
      # Only the reports. clerk-runs/ holds full exports with password hashes:
      # synthetic users, but no reason to publish them from a public repo.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: migrate-live-results
          path: test/migrate-live/test-results/
          retention-days: 7

  notify-failure:
    needs: [migrate-live]
    # Only scheduled runs alert: someone who dispatched a run is watching it.
    if: ${{ always() && github.event_name == 'schedule' && needs.migrate-live.result == 'failure' }}
    uses: ./.github/workflows/notify-failure.yml
    with:
      workflow-name: Migrate live tests
    secrets:
      # A repo secret, not an environment one: a job that calls a reusable
      # workflow can't set `environment:`.
      SLACK_WEBHOOK_URL: ${{ secrets.MIGRATION_LIVE_TESTS_SLACK_WEBHOOK_URL }}
